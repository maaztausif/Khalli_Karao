<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="rg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF6B75"/>
      <stop offset="100%" stop-color="#F03545"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#rg)"/>

  <!-- Subtle highlight -->
  <ellipse cx="380" cy="280" rx="240" ry="150" fill="white" opacity="0.08"/>

  <!-- ── ARTIST PALETTE ── -->
  <!-- Palette body (tan/wood color) -->
  <path d="
    M 512 220
    C 680 220 800 330 800 480
    C 800 560 760 620 700 650
    C 660 672 620 660 590 640
    C 560 620 540 600 512 600
    C 484 600 464 620 434 640
    C 404 660 364 672 324 650
    C 264 620 224 560 224 480
    C 224 330 344 220 512 220 Z
  " fill="#D4956A"/>

  <!-- Palette hole (thumb) -->
  <ellipse cx="618" cy="555" rx="52" ry="52" fill="#F03545"/>

  <!-- Paint blobs around palette -->

  <!-- Red blob - top left -->
  <circle cx="346" cy="316" r="58" fill="#E53935"/>
  <circle cx="346" cy="316" r="44" fill="#EF5350"/>

  <!-- Yellow blob - top center -->
  <circle cx="512" cy="268" r="58" fill="#F5B800"/>
  <circle cx="512" cy="268" r="44" fill="#FFD000"/>

  <!-- Green blob - top right -->
  <circle cx="676" cy="316" r="58" fill="#43A047"/>
  <circle cx="676" cy="316" r="44" fill="#66BB6A"/>

  <!-- Blue blob - right -->
  <circle cx="738" cy="460" r="58" fill="#1E88E5"/>
  <circle cx="738" cy="460" r="44" fill="#42A5F5"/>

  <!-- Orange blob - left -->
  <circle cx="286" cy="460" r="58" fill="#FB8C00"/>
  <circle cx="286" cy="460" r="44" fill="#FFA726"/>

  <!-- Purple blob - bottom left -->
  <circle cx="370" cy="565" r="50" fill="#8E24AA"/>
  <circle cx="370" cy="565" r="37" fill="#AB47BC"/>

  <!-- Paintbrush -->
  <!-- Handle -->
  <rect x="650" y="580" width="26" height="220" rx="13" fill="#8D6E63" transform="rotate(-40, 663, 690)"/>
  <!-- Ferrule (metal band) -->
  <rect x="650" y="690" width="26" height="28" rx="4" fill="#BDBDBD" transform="rotate(-40, 663, 690)"/>
  <!-- Bristles -->
  <ellipse cx="712" cy="786" rx="22" ry="38" fill="#E65100" transform="rotate(-40, 712, 786)"/>
  <ellipse cx="712" cy="786" rx="14" ry="30" fill="#FF8F00" transform="rotate(-40, 712, 786)"/>
</svg>
