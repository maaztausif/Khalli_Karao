<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="circleGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#F5A800"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="roundRect">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="url(#bgGrad)"/>

  <!-- Subtle glow behind circle -->
  <circle cx="512" cy="490" r="320" fill="#F5B800" opacity="0.12" filter="url(#glow)"/>

  <!-- Main yellow circle -->
  <circle cx="512" cy="490" r="296" fill="url(#circleGrad)" filter="url(#softShadow)"/>

  <!-- Inner circle highlight -->
  <circle cx="480" cy="420" r="120" fill="white" opacity="0.06"/>

  <!-- KHALLI text -->
  <text
    x="512" y="432"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="-2"
  >KHALLI</text>

  <!-- KARAO text -->
  <text
    x="512" y="566"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="148"
    fill="#111111"
    text-anchor="middle"
    letter-spacing="-2"
  >KARAO</text>

  <!-- Exclamation mark -->
  <text
    x="512" y="660"
    font-family="Arial Black, Arial, sans-serif"
    font-weight="900"
    font-size="64"
    fill="#111111"
    text-anchor="middle"
  >!</text>

  <!-- Small decorative dots -->
  <circle cx="232" cy="490" r="10" fill="#111" opacity="0.3"/>
  <circle cx="792" cy="490" r="10" fill="#111" opacity="0.3"/>
</svg>
